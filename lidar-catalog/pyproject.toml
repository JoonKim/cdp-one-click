[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-catalog"
version = "0.1.0"
description = "Register one COPC/LAZ tile in the Iceberg table default.lidar_catalog."
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
iceberg = ["pyspark>=3.5"]
dev = ["pytest>=8"]

[project.scripts]
lidar-catalog = "lidar_catalog.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
