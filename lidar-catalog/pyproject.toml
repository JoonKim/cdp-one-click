[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-catalog"
version = "0.1.0"
description = "Register COPC/LAZ tiles and flatten their points into an H3-partitioned Iceberg table."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "h3>=4"]

[project.optional-dependencies]
iceberg = ["pyspark>=3.5"]
dev = ["pytest>=8"]

[project.scripts]
lidar-catalog = "lidar_catalog.__main__:main"
lidar-flatten = "lidar_catalog.flatten:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
