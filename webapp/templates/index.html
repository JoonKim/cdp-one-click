<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entity Map — CDP Geospatial</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <div>
        <h1>Entity Map</h1>
        <p class="subtitle">Initial datasets from the <code id="entity-dir">entity</code> directory</p>
      </div>
    </div>
    <div class="actions">
      <span id="gs-badge" class="badge badge-muted" title="GeoServer connection status">GeoServer: checking…</span>
      <button id="create-layer" class="btn btn-primary" disabled>
        <span class="btn-label">Create GeoServer Layer</span>
        <span class="spinner" hidden></span>
      </button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2>Datasets</h2>
      <ul id="dataset-list" class="dataset-list">
        <li class="empty">Loading…</li>
      </ul>
      <div class="log-panel">
        <h2>Activity</h2>
        <ol id="log" class="log"></ol>
      </div>
    </aside>
    <div id="map" class="map"></div>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="/static/app.js"></script>
</body>
</html>
