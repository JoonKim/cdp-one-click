services:
  geoserver:
    image: docker.osgeo.org/geoserver:2.25.2
    container_name: entity-geoserver
    ports:
      - "8080:8080"
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      SKIP_DEMO_DATA: "true"
      INSTALL_EXTENSIONS: "false"
    volumes:
      # Shapefiles generated by publish_entity.sh are served from here.
      - ./data:/opt/entity_data:ro
    restart: unless-stopped
